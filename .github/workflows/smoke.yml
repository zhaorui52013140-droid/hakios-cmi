# 诊断用：同一份工作流跑四种 runner，一次分清三件事
#   linux 成功 + windows 成功 + mac 全 cancelled  → 只有 macOS 被挡（付费/资格门槛）
#   linux 成功 + windows 也 cancelled            → 所有付费 SKU 被挡
#   macos-latest 成功 + macos-14 cancelled       → macos-14 这个标签已退役
name: smoke
on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - run: echo "linux ok"; uname -a

  windows:
    runs-on: windows-latest
    steps:
      - run: echo "windows ok"; ver

  mac_latest:
    runs-on: macos-latest
    steps:
      - run: echo "macos-latest ok"; sw_vers; uname -m

  mac_14:
    runs-on: macos-14
    steps:
      - run: echo "macos-14 ok"; sw_vers; uname -m
